name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q VehicleGuard.zip
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Build
        shell: bash
        working-directory: VehicleGuard
        run: gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log
      - name: Show errors
        if: failure()
        working-directory: VehicleGuard
        run: |
          { grep "^e: " build.log; grep -A6 "What went wrong" build.log; } | head -10 | while IFS= read -r l; do echo "::error::$l"; done
      - uses: actions/upload-artifact@v4
        with: { name: VehicleGuard-APK, path: VehicleGuard/app/build/outputs/apk/debug/app-debug.apk }
